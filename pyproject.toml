[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopscape"
version = "0.1.0"
description = "Training and evaluation of loopable environmental soundscapes with TangoFlux"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML>=6.0,<7",
  "safetensors>=0.4,<1",
  "huggingface-hub>=0.24,<1",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
quality = ["frechet-audio-distance>=0.3,<1"]

[tool.setuptools.packages.find]
include = ["loopscape*"]
